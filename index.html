<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Groundwork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: a field notebook. A slim index of tabs on the left (a strip on phones) and one working surface on the right.
   Survey-ink blue on cool grey paper. Amber is reserved for places where sources disagree. */
:root{
  --bg:#EDF0F1; --surface:#F9FAFA; --surface-2:#E3E8EA; --ink:#12202A; --ink-2:#44545F; --ink-3:#66757F;
  --line:#CBD3D8; --accent:#0B4F6C; --accent-ink:#FFFFFF; --accent-soft:#D5E6EE;
  --warn:#8F5400; --warn-soft:#F6E7C9; --good:#1E6B45; --good-soft:#D6EBDD; --bad:#A33327; --bad-soft:#F3D9D5;
  --c1:#0B4F6C; --c2:#2F8F83; --c3:#B8860B; --c4:#7A6AA8; --c5:#C0563B;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1519; --surface:#131D22; --surface-2:#1B2830; --ink:#E4ECEF; --ink-2:#A9B8C0; --ink-3:#8696A0;
    --line:#2A3A44; --accent:#6CC2E0; --accent-ink:#06222C; --accent-soft:#16333F;
    --warn:#E6A94A; --warn-soft:#3A2D14; --good:#6FCB98; --good-soft:#15301F; --bad:#F08A7C; --bad-soft:#3B1E1A;
    --c1:#6CC2E0; --c2:#5FC9B8; --c3:#E2BE55; --c4:#A99BDB; --c5:#EE8F72; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1519; --surface:#131D22; --surface-2:#1B2830; --ink:#E4ECEF; --ink-2:#A9B8C0; --ink-3:#8696A0;
  --line:#2A3A44; --accent:#6CC2E0; --accent-ink:#06222C; --accent-soft:#16333F;
  --warn:#E6A94A; --warn-soft:#3A2D14; --good:#6FCB98; --good-soft:#15301F; --bad:#F08A7C; --bad-soft:#3B1E1A;
  --c1:#6CC2E0; --c2:#5FC9B8; --c3:#E2BE55; --c4:#A99BDB; --c5:#EE8F72; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);padding-inline:16px;padding-block:20px 48px}
.app{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr);gap:8px 32px;align-items:start}
.top{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 24px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:700 26px/1 var(--f-display);letter-spacing:-.02em}
.brand svg{width:26px;height:26px}
.tag{margin:0;color:var(--ink-2);font-size:15px}
.stamp{margin:0 0 0 auto;font:400 12px var(--f-mono);color:var(--ink-3)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);display:flex;flex-direction:column;gap:2px;padding-top:14px}
.tabs button{all:unset;box-sizing:border-box;cursor:pointer;padding:9px 12px;border-radius:6px;color:var(--ink-2);font:500 14px var(--f-body);display:flex;justify-content:space-between;gap:8px;align-items:center}
.tabs button small{font:400 11px var(--f-mono);color:var(--ink-3)}
.tabs button:hover{background:var(--surface-2)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs button[aria-selected="true"] small{color:inherit;opacity:.8}
.tabs button:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{min-width:0;padding-top:14px}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.015em;text-wrap:balance;margin:0}
h2{font-size:28px;line-height:1.15;margin-bottom:6px}
h3{font-size:18px;line-height:1.25}
.lede{color:var(--ink-2);max-width:68ch;margin:0 0 20px}
.eyebrow{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.panel[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid-plan{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.controls{display:flex;flex-direction:column;gap:16px;position:sticky;top:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lbl{font:600 12px var(--f-body);letter-spacing:.02em;color:var(--ink-2)}
.field .val{font:500 13px var(--f-mono);color:var(--ink)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
input[type=range]{width:100%;accent-color:var(--accent)}
select,input[type=text],input[type=url],textarea{width:100%;font:400 14px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
textarea{min-height:92px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;padding:5px 10px;border:1px solid var(--line);border-radius:999px;font:500 12px var(--f-body);color:var(--ink-2);background:var(--bg)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.wt{display:grid;grid-template-columns:10px 1fr 28px;gap:8px;align-items:center;font-size:13px}
.dot{width:10px;height:10px;border-radius:2px;display:inline-block}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font:600 13px var(--f-body)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.checkrow{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2)}
.entry{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0 6px}
.entry .m{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:4px;min-width:0}
.entry .m.rec{border-color:var(--accent);background:var(--accent-soft)}
.entry .m b{font:600 14px var(--f-body)}
.entry .m span{font-size:13px;color:var(--ink-2)}
.tagrec{font:500 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.note{font-size:12.5px;color:var(--ink-3)}
.results{display:flex;flex-direction:column;gap:12px;min-width:0}
.city{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.rank{font:700 30px/1 var(--f-display);color:var(--accent);padding-top:2px}
.city h3 small{font:400 13px var(--f-body);color:var(--ink-3);margin-left:6px}
.score{display:flex;align-items:center;gap:10px;margin:8px 0 4px}
.score .n{font:500 20px var(--f-mono);min-width:56px}
.stack{flex:1;display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--surface-2)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 14px;margin:8px 0;padding:10px 0;border-block:1px solid var(--line)}
.facts div{min-width:0}
.facts dt{font:500 11px var(--f-mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.facts dd{margin:0;font:500 14px var(--f-mono);font-variant-numeric:tabular-nums}
.facts dd small{font:400 11px var(--f-body);color:var(--ink-3)}
.city ul{margin:6px 0 0;padding-left:18px;font-size:13.5px;color:var(--ink-2)}
.city li{margin-bottom:3px}
.src{display:inline-block;margin-left:3px;padding:0 5px;border-radius:3px;background:var(--surface-2);color:var(--accent);font:500 10.5px/16px var(--f-mono);text-decoration:none;vertical-align:1px}
.src:hover{background:var(--accent);color:var(--accent-ink)}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font:500 11px var(--f-mono);letter-spacing:.03em}
.b-hi{background:var(--good-soft);color:var(--good)}
.b-md{background:var(--warn-soft);color:var(--warn)}
.b-lo{background:var(--bad-soft);color:var(--bad)}
.b-info{background:var(--accent-soft);color:var(--accent)}
.brief{margin-top:4px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
.q h3{margin-bottom:4px}
.spread{display:inline-flex;gap:8px;align-items:center;background:var(--warn-soft);color:var(--warn);padding:3px 10px;border-radius:6px;font:500 12px var(--f-mono);margin:6px 0 12px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(120px,240px) minmax(0,1fr) 84px;gap:10px;align-items:center;font-size:13px}
.bar .t{height:16px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar .t i.alt{background:var(--c3)}
.bar .v{font:500 13px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.bar .l{min-width:0}
.pair{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px dashed var(--line)}
.pair:first-child{border-top:0}
.pair .head{display:flex;justify-content:space-between;font-weight:600;font-size:13.5px}
.ratio{font:500 12px var(--f-mono);color:var(--warn)}
.stance{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:13.5px}
.stance:first-of-type{border-top:0}
.how{margin-top:12px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);font-size:13.5px;border-radius:0 6px 6px 0}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13.5px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td b{font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:10px 16px;margin-bottom:14px;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pc .top2{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pc h3{font-size:16px}
.ladder{display:flex;gap:4px;margin:4px 0}
.ladder i{flex:1;height:6px;border-radius:2px;background:var(--surface-2)}
.ladder i.on{background:var(--accent)}
.ev{margin:4px 0 0;padding:0;list-style:none;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.ev li{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px}
.ev .k{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);padding-top:2px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.form{display:flex;flex-direction:column;gap:10px}
.about p,.about li{max-width:70ch;color:var(--ink-2)}
.about h3{margin:22px 0 6px}
.srclist{columns:2 300px;font-size:13px;color:var(--ink-2);padding-left:22px}
.srclist li{break-inside:avoid;margin-bottom:5px}
.srclist a{color:var(--accent)}
.empty{padding:20px;border:1px dashed var(--line);border-radius:10px;color:var(--ink-3);text-align:center}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .tabs{position:static;flex-direction:row;overflow-x:auto;padding-block:10px 4px;gap:4px;scrollbar-width:thin}
  .tabs button{white-space:nowrap;flex:0 0 auto}
  .tabs button small{display:none}
  .grid-plan{grid-template-columns:minmax(0,1fr)}
  .controls{position:static}
  .entry{grid-template-columns:minmax(0,1fr)}
  .stamp{margin-left:0}
  .bar{grid-template-columns:minmax(0,1fr) 78px;grid-template-areas:"l v" "t t"}
  .bar .l{grid-area:l}.bar .v{grid-area:v}.bar .t{grid-area:t}
  h2{font-size:24px}
}
@media (prefers-reduced-motion:no-preference){ .stack i{transition:width .25s ease} }

/* ---------- motion and polish layer ---------- */
html{scroll-behavior:auto}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
.tx,.tx *{transition:background-color .35s ease,color .35s ease,border-color .35s ease,fill .35s ease,stroke .35s ease !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header: survey contours and theme switch */
.top{position:relative;isolation:isolate;align-items:center}
.contour{position:absolute;right:-12px;top:-26px;width:min(560px,72%);height:150px;z-index:-1;pointer-events:none;opacity:.6;-webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);mask-image:linear-gradient(90deg,transparent,#000 45%)}
.contour ellipse{fill:none;stroke:var(--accent);stroke-width:1;opacity:.4}
.contour g{transform-origin:360px 75px}
.stamp{margin-left:auto}
.themebtn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;gap:7px;align-items:center;padding:5px 11px;border:1px solid var(--line);border-radius:999px;font:500 12px var(--f-body);color:var(--ink-2);background:var(--surface);transition:border-color .15s,color .15s,transform .12s}
.themebtn svg{width:14px;height:14px}
.themebtn:hover{border-color:var(--accent);color:var(--accent)}
.themebtn:active{transform:scale(.96)}
.themebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* market figures */
.kpis{grid-column:1 / -1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kv{font:700 30px/1.05 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--accent)}
.kl{font-size:12.5px;color:var(--ink-2)}
@media (prefers-reduced-motion:no-preference){.kpi{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}}

/* tabs with a sliding indicator */
.tabs{position:sticky}
.tabs button{position:relative;z-index:1;transition:color .2s,background-color .15s}
.tabs button[aria-selected="true"]{background:transparent;color:var(--accent-ink)}
.tabs .ind{position:absolute;left:0;top:0;width:0;height:0;border-radius:6px;background:var(--accent);z-index:0;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.tabs .ind{transition:transform .3s cubic-bezier(.3,.8,.3,1),width .3s cubic-bezier(.3,.8,.3,1),height .3s}}
.panel.enter{animation:panelIn .34s cubic-bezier(.2,.7,.2,1) both}
@keyframes panelIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fillx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes bump{0%{transform:none}35%{transform:scale(1.025);box-shadow:0 0 0 5px var(--accent-soft)}100%{transform:none;box-shadow:0 0 0 0 transparent}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.rowin{animation:rowIn .32s ease both}

/* controls */
.chip,.btn{transition:background-color .15s,color .15s,border-color .15s,transform .12s,filter .15s}
.chip:hover{border-color:var(--accent)}
.chip:active,.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.1)}
input[type=range]{-webkit-appearance:none;appearance:none;height:22px;background:transparent;cursor:pointer;margin:0;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--p),var(--surface-2) var(--p))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--surface-2)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-6px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);transition:transform .15s,box-shadow .15s}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.15)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25);box-shadow:0 0 0 6px var(--accent-soft)}
input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
select,input[type=text],input[type=url],textarea{transition:border-color .15s,box-shadow .15s}
select:focus,input[type=text]:focus,input[type=url]:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* planner results */
.entry .m{transition:border-color .25s,background-color .25s,transform .25s}
.entry .m.rec{transform:translateY(-2px)}
.entry .m .tagrec{display:none}
.entry .m.rec .tagrec{display:block}
.clist{display:flex;flex-direction:column;gap:12px}
.city{transition:border-color .2s,box-shadow .25s}
.city:hover{border-color:var(--accent);box-shadow:0 10px 30px -14px rgba(0,0,0,.3)}
.city.lead{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.city .lv{font-weight:500;font-variant-numeric:tabular-nums}
.score .n{font-variant-numeric:tabular-nums}
.stack i{transition:width .4s cubic-bezier(.2,.8,.2,1)}
.whyp{margin:0;font-size:14px}
.viz{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.vz{min-width:0}
.vz h3{font-size:15px;margin:2px 0 2px}
.vz .note{margin:0 0 6px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:400 10.5px var(--f-mono);fill:var(--ink-3)}
.chart .grid line,.chart .ring,.chart .spoke{stroke:var(--line);stroke-width:1;fill:none}
.chart .ring{fill:none}
.chart .pt{cursor:pointer;outline:none}
.chart .pt .b{fill:var(--ink-3);fill-opacity:.1;stroke:var(--ink-3);stroke-width:1.2;transition:fill-opacity .2s,stroke-width .2s,stroke .2s,fill .2s}
.chart .pt.dashed .b{stroke-dasharray:3 3}
.chart .pt.sel .b{fill:var(--accent);fill-opacity:.32;stroke:var(--accent);stroke-width:2}
.chart .pt:hover .b,.chart .pt:focus-visible .b{fill-opacity:.55;stroke-width:2.4}
.chart .pt:focus-visible .b{stroke:var(--ink)}
.chart .pt .nm{font:500 11px var(--f-body);fill:var(--ink)}
.chart .pt .rkn{font:700 11px var(--f-mono);fill:var(--ink);text-anchor:middle}
.chart .rp{fill-opacity:.14;stroke-width:2;stroke-linejoin:round}
.chart .rp.r0{stroke:var(--c1);fill:var(--c1)}
.chart .rp.r1{stroke:var(--c5);fill:var(--c5);stroke-dasharray:7 4}
.chart .rp.r2{stroke:var(--c4);fill:var(--c4);stroke-dasharray:2 4}
.chart .rl{font:500 11px var(--f-body);fill:var(--ink-2)}
.rleg{display:flex;flex-direction:column;gap:4px;margin-top:2px;font-size:12.5px;color:var(--ink-2)}
.rleg span{display:flex;gap:8px;align-items:center}
.rleg svg{width:28px;height:8px;flex:none}

    USEREV.push({p:$('evp').value,k:$('evk').value,t:t,u:u});store('gw-ev',USEREV);
    $('evt').value='';$('evu').value='';m.textContent='Added to '+USEREV[USEREV.length-1].p+'. Their step has been recalculated.';renderProviders(USEREV[USEREV.length-1].p);
  });
  $('evr').addEventListener('click',function(){USEREV=[];store('gw-ev',USEREV);$('evm').textContent='Your additions are removed.';renderProviders();});
}
function renderProviders(bump,first){
  var html=PROV.map(function(p){
    var t=tierOf(p),mine=USEREV.filter(function(u){return u.p===p.n;});
    var items=p.ev.map(function(e){return '<li><span class="k">'+KTXT[e[0]]+'</span><span>'+esc(e[1])+sc(e[2])+'</span></li>';}).join('')+
      mine.map(function(u){return '<li><span class="k">'+KTXT[u.k]+'</span><span>'+esc(u.t)+(u.u?' <a class="src" href="'+esc(u.u)+'" target="_blank" rel="noopener">link</a>':'')+' <span class="badge b-info">added by you</span></span></li>';}).join('');
    return '<article class="pc'+(first?' rowin':'')+'" data-p="'+esc(p.n)+'"><div class="top2"><h3>'+esc(p.n)+'</h3><span class="badge '+(t===3?'b-hi':t===2?'b-info':'b-md')+'">'+TIERN[t]+'</span></div><div class="ladder" aria-hidden="true">'+[1,2,3].map(function(i){return '<i class="'+(i<=t?'on':'')+'" style="--k:'+(i-1)+'"></i>';}).join('')+'</div><div class="note">'+esc(p.what)+'</div><ul class="ev">'+items+'</ul></article>';
  }).join('');
  $('pcards').innerHTML=html;
  if(bump&&!RM){var cs=$('pcards').children;for(var q=0;q<cs.length;q++){if(cs[q].getAttribute('data-p')===bump){cs[q].classList.add('bump');break;}}}
}

/* ---------- about ---------- */
function buildAbout(){
  $('p-about').innerHTML='<h2>Method and gaps</h2><p class="lede">What this prototype is, what is real in it, and what is missing. Read this before you trust a number.</p>'+
   '<h3>What it does</h3><ul><li>Ranks 12 Indian cities for a new GCC using rent, depth of existing GCCs, state incentives, space availability and momentum, with weights you control.</li><li>Shows where public sources disagree instead of hiding it.</li><li>Tracks state incentive programmes and a sample of 2026 GCC announcements.</li><li>Separates what providers claim from what others have confirmed.</li></ul>'+
   '<h3>How the score works</h3><p>Each factor is scaled 0 to 100. Rent uses CRE Matrix Q1 CY26 market rents. Depth averages the two published city counts where both exist. Incentives rate each state from 2 (general IT policy only) to 5 (quantified land, operating and payroll support), which is Groundwork’s own reading of the sources. Space availability uses vacancy. Momentum uses new GCCs added in FY25 where a count exists. Cities with thin data lose 3% (medium) or 8% (low) of their score, shown on the card.</p>'+
   '<h3>What is modelled, not measured</h3><ul><li>Emerging-city rent is set at ₹70 per sq ft per month. That is the median of the six metro rents cut by 27.5%, the midpoint of the 25% to 30% operating-cost saving that sources quote for smaller cities.</li><li>Emerging-city vacancy, GCC counts and momentum are placeholders and flagged Low confidence.</li><li>Entry-model timelines and costs come from vendors who sell those services.</li></ul>'+
   '<h3>Known gaps</h3><ul><li>No company-level registry yet. Counts come from reports, not rows.</li><li>No salary benchmarks by role. Only median tech pay for three emerging cities.</li><li>State incentives are read from reviews and press, not the government orders.</li><li>Provider evidence is a small hand-built sample.</li></ul>'+
   '<h3>First 90 days</h3><ul><li>Build the company registry from public filings and press, with one row per GCC unit.</li><li>Replace review-based state rows with the gazetted orders and mark each with its date.</li><li>Collect client attestations for the first 20 providers.</li><li>Open the pipeline feed to real-estate and recruitment teams who want early signals.</li></ul>'+
   '<h3>All sources</h3><ol class="srclist">'+SRC.map(function(s){return '<li><a href="'+s.u+'" target="_blank" rel="noopener">'+esc(s.t)+'</a></li>';}).join('')+'</ol>';
}

/* ---------- ledger reveal ---------- */
function revealQs(){
  var qs=Array.prototype.slice.call(document.querySelectorAll('#p-ledger .q'));
  document.documentElement.classList.add('js');
  if(RM||!('IntersectionObserver' in window)){qs.forEach(function(q){q.classList.add('in');});return;}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{rootMargin:'0px 0px -10% 0px',threshold:0.04});
  qs.forEach(function(q){io.observe(q);});
  setTimeout(function(){qs.forEach(function(q){q.classList.add('in');});},6000);
}

var ICON_MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

function effTheme(){var a=document.documentElement.getAttribute('data-theme');if(a==='dark'||a==='light')return a;return(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}
function syncTheme(){var b=$('themebtn'),t=effTheme();b.innerHTML=(t==='dark'?ICON_SUN:ICON_MOON)+'<span>'+(t==='dark'?'Light':'Dark')+'</span>';b.setAttribute('aria-label','Switch to '+(t==='dark'?'light':'dark')+' theme');}
function setTheme(t,save,animate){
  var r=document.documentElement;
  if(animate&&!RM){r.classList.add('tx');setTimeout(function(){r.classList.remove('tx');},460);}
  r.setAttribute('data-theme',t);
  if(save)store('gw-theme',t);
  syncTheme();
}

buildTabs();
$('stamp').textContent='Prototype · '+SRC.length+' public sources · compiled 10 Oct 2026';

if(savedTheme==='dark'||savedTheme==='light')setTheme(savedTheme,false,false);else syncTheme();

Array.prototype.forEach.call(document.querySelectorAll('#kpis [data-c]'),function(el){

window.__gw={rankCities:rankCities,entryModel:entryModel,CITIES:CITIES,PRESETS:PRESETS,S:S,tierOf:tierOf,PROV:PROV,show:show,tween:tween};
